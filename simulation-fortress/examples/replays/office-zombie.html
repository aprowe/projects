<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>office drama</title>
<style>
:root {
  --bg: #0d1117;
  --fg: #c9d1d9;
  --muted: #8b949e;
  --accent: #58a6ff;
  --panel: #161b22;
  --border: #30363d;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}
header .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 12px;
}
.tickline {
  color: var(--muted);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
pre.ascii {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  margin: 0;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  font-size: 14px;
  line-height: 1.15;
  white-space: pre;
  overflow-x: auto;
  color: var(--fg);
}
.narration {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-size: 15px;
  min-height: 60px;
}
.narration ul {
  margin: 0;
  padding-left: 20px;
}
.narration li { margin: 0 0 4px 0; }
.narration .empty { color: var(--muted); font-style: italic; }
.controls {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  position: sticky;
  bottom: 8px;
}
.controls button {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  min-width: 44px;
}
.controls button:hover { border-color: var(--accent); }
.controls button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); }
.controls .speed { display: flex; align-items: center; gap: 4px; }
.controls input[type=range] {
  flex: 1;
  min-width: 140px;
  accent-color: var(--accent);
}
.controls select {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 14px;
  font-family: inherit;
}
@media (max-width: 600px) {
  pre.ascii { font-size: 12px; }
  .controls { font-size: 13px; padding: 8px; gap: 6px; }
  .controls button { padding: 6px 10px; }
}
</style>
</head>
<body>
<header>
  <h1>office drama</h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="tickline" id="tickline">tick 0</div>
  <pre class="ascii" id="ascii"></pre>
  <div class="narration" id="narration"></div>
  <div class="controls">
    <button id="prev" aria-label="previous tick">⏮</button>
    <button id="play" class="primary" aria-label="play/pause">▶</button>
    <button id="next" aria-label="next tick">⏭</button>
    <input type="range" id="scrub" min="0" max="0" value="0">
    <span class="speed">
      <label for="speed">speed</label>
      <select id="speed">
        <option value="1500">0.7×</option>
        <option value="1000" selected>1×</option>
        <option value="500">2×</option>
        <option value="200">5×</option>
        <option value="80">12×</option>
      </select>
    </span>
  </div>
</main>
<script>
const FRAMES = [{"tick":0,"ascii":"── tick    0 ── z=0 ── entities 5/5 alive ──\n............\n.ooooo......\n............\n............\n............\n............\n............\n............\n............\n............\n\n","narration":["Monday morning at the office.","Voxels from (0, 0, 0) to (11, 9, 0) are filled with material #1.","Five workers file in, mugs and laptops in tow.","A alice (office) appears at (1, 1, 0).","alice#5 equips a cotton t-shirt on the torso.","alice#5 equips a leather boots on the feet.","A bob (office) appears at (2, 1, 0).","bob#30 equips a cotton t-shirt on the torso.","bob#30 equips a leather boots on the feet.","A carol (office) appears at (3, 1, 0).","carol#55 equips a cotton t-shirt on the torso.","carol#55 equips a leather boots on the feet.","A dave (office) appears at (4, 1, 0).","dave#80 equips a cotton t-shirt on the torso.","dave#80 equips a leather boots on the feet.","A eve (office) appears at (5, 1, 0).","eve#105 equips a cotton t-shirt on the torso.","eve#105 equips a leather boots on the feet."]},{"tick":5,"ascii":"── tick    5 ── z=0 ── entities 5/5 alive ──\n............\n....o.......\n............\n..o..o......\n............\n............\n..o..o......\n............\n............\n............\n\n","narration":["bob#30 interacts with desk_1#2.","carol#55 steps southwest to (2, 6, 0).","dave#80 steps southeast to (5, 6, 0).","eve#105 steps west to (4, 1, 0).","bob#30 sits down and starts typing."]},{"tick":10,"ascii":"── tick   10 ── z=0 ── entities 5/5 alive ──\n............\n............\n............\n..o.o.......\n............\n............\n..o..o......\n............\n............\n............\n\n","narration":["alice#5 steps east to (4, 3, 0).","bob#30 steps west to (4, 3, 0)."]},{"tick":15,"ascii":"── tick   15 ── z=0 ── entities 5/5 alive ──\n............\n............\n............\n..o..o.o....\n............\n............\n..o..o......\n............\n............\n............\n\n","narration":["eve#105 steps east to (7, 3, 0)."]},{"tick":20,"ascii":"── tick   20 ── z=0 ── entities 5/5 alive ──\n............\n..........o.\n............\n..o..o..o...\n............\n............\n..o.........\n............\n............\n............\n\n","narration":["bob#30 interacts with desk_0#1.","dave#80 steps northeast to (8, 3, 0).","eve#105 interacts with coffee_station#0.","eve#105 fills their mug and takes a slow sip.","bob#30 sits down and starts typing."]},{"tick":25,"ascii":"── tick   25 ── z=0 ── entities 6/6 alive ──\n............\n............\n........o...\n......o.....\n....o.?.....\n......o.....\n............\n...o........\n............\n............\n\n","narration":["zombie#130 steps east to (6, 4, 0).","alice#5 steps west to (6, 5, 0).","bob#30 steps east to (4, 4, 0).","carol#55 steps east to (3, 7, 0).","dave#80 steps west to (8, 2, 0).","eve#105 steps southwest to (6, 3, 0)."]},{"tick":30,"ascii":"── tick   30 ── z=0 ── entities 6/6 alive ──\n...........o\n............\n.........o..\n........o...\n............\n............\n...?........\n............\n.o..........\n............\n\n","narration":["zombie#130 steps southwest to (3, 6, 0).","alice#5 steps southwest to (1, 8, 0).","bob#30 steps northeast to (9, 2, 0).","carol#55 steps northeast to (8, 3, 0).","dave#80 steps northeast to (11, 0, 0).","eve#105 steps northeast to (9, 2, 0)."]},{"tick":35,"ascii":"── tick   35 ── z=0 ── entities 6/6 alive ──\n...........o\n............\n............\n............\n............\n............\n............\n............\n.?..........\n..o.........\n\n","narration":["alice#5's right foot is crushed by the steel crowbar (25 dmg).","alice#5's right foot is crushed beyond use by the steel crowbar.","zombie#130 strikes alice#5 for 25 damage (target now at 16 hp).","alice#5 steps east to (2, 9, 0).","A scream pierces the air from (2, 9, 0)."]},{"tick":40,"ascii":"── tick   40 ── z=0 ── entities 6/6 alive ──\n...........o\n............\n............\n............\n.......o....\n............\n.....?......\n............\n............\n............\n\n","narration":["zombie#130 steps northeast to (5, 6, 0).","alice#5 steps northeast to (7, 4, 0)."]},{"tick":45,"ascii":"── tick   45 ── z=0 ── entities 6/6 alive ──\n...........o\n..........?.\n............\n............\n............\n............\n............\n............\n............\n............\n\n","narration":["zombie#130 steps northeast to (10, 1, 0)."]},{"tick":50,"ascii":"── tick   50 ── z=0 ── entities 5/6 alive ──\n............\n..........?.\n.......o....\n............\n............\n............\n............\n............\n............\n............\n\n","narration":["bob#30 steps southwest to (7, 2, 0).","carol#55 steps southwest to (7, 2, 0).","dave#80 steps southwest to (7, 2, 0).","eve#105 steps southwest to (7, 2, 0)."]},{"tick":55,"ascii":"── tick   55 ── z=0 ── entities 5/6 alive ──\n............\n..........?.\n............\n............\n............\n............\n............\n..o.........\n............\n............\n\n","narration":["bob#30 steps southwest to (2, 7, 0).","carol#55 steps southwest to (2, 7, 0).","dave#80 steps southwest to (2, 7, 0).","eve#105 steps southwest to (2, 7, 0)."]},{"tick":60,"ascii":"── tick   60 ── z=0 ── entities 5/6 alive ──\n............\n..........?.\n............\n............\n............\n............\n............\n............\n............\no...........\n\n","narration":[]},{"tick":65,"ascii":"── tick   65 ── z=0 ── entities 5/6 alive ──\n............\n..........?.\n............\n............\n............\n............\n............\n............\n............\no...........\n\n","narration":[]},{"tick":70,"ascii":"── tick   70 ── z=0 ── entities 5/6 alive ──\n............\n..........?.\n............\n............\n............\n............\n............\n............\n............\no...........\n\n","narration":[]}];
const $ = (id) => document.getElementById(id);
const meta = $("meta");
const tickline = $("tickline");
const asciiEl = $("ascii");
const narrEl = $("narration");
const scrub = $("scrub");
const playBtn = $("play");
const prevBtn = $("prev");
const nextBtn = $("next");
const speedSel = $("speed");

let idx = 0;
let timer = null;
let playing = false;

function render() {
  const f = FRAMES[idx];
  if (!f) return;
  tickline.textContent = `tick ${f.tick}  (frame ${idx + 1}/${FRAMES.length})`;
  asciiEl.textContent = f.ascii;
  if (f.narration && f.narration.length > 0) {
    const ul = document.createElement("ul");
    f.narration.forEach(s => {
      const li = document.createElement("li");
      li.textContent = s;
      ul.appendChild(li);
    });
    narrEl.replaceChildren(ul);
  } else {
    narrEl.replaceChildren(Object.assign(document.createElement("span"), { className: "empty", textContent: "(quiet — no events this tick)" }));
  }
  scrub.value = idx;
}

function step(by) {
  idx = Math.max(0, Math.min(FRAMES.length - 1, idx + by));
  render();
}

function tick() {
  if (idx >= FRAMES.length - 1) {
    pause();
    return;
  }
  step(1);
}

function play() {
  if (playing) return;
  if (idx >= FRAMES.length - 1) idx = 0;
  playing = true;
  playBtn.textContent = "⏸";
  const interval = parseInt(speedSel.value, 10);
  timer = setInterval(tick, interval);
}

function pause() {
  playing = false;
  playBtn.textContent = "▶";
  if (timer) clearInterval(timer);
  timer = null;
}

playBtn.addEventListener("click", () => playing ? pause() : play());
prevBtn.addEventListener("click", () => { pause(); step(-1); });
nextBtn.addEventListener("click", () => { pause(); step(1); });
scrub.addEventListener("input", (e) => {
  pause();
  idx = parseInt(e.target.value, 10);
  render();
});
speedSel.addEventListener("change", () => {
  if (playing) { pause(); play(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === "ArrowRight") { pause(); step(1); }
  else if (e.key === "ArrowLeft") { pause(); step(-1); }
});

// Initialize
scrub.max = FRAMES.length - 1;
meta.textContent = `${FRAMES.length} frames captured`;
render();
</script>
</body>
</html>
