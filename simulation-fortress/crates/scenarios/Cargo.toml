[package]
name = "fortress-scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Example scenarios driving the fortress-engine simulation core"

[lints]
workspace = true

[[bin]]
name = "fortress"
path = "src/main.rs"

[dependencies]
bevy_ecs = "0.18"
fortress-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
