<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tauri-video-prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        height: 100%;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 8px;
      }
      #stage {
        background: #111;
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: 85vh;
      }
      #status {
        font-size: 12px;
        opacity: 0.7;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 11px;
        line-height: 1.4;
        color: #cde;
        pointer-events: none;
        white-space: pre;
      }
      #hud .label { color: #889; }
      #hud .val { color: #fff; }
      #hud .warn { color: #ffb86c; }
      #hud .bad { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="stage" width="16" height="16"></canvas>
      <div id="status">idle</div>
    </div>
    <pre id="hud">starting…</pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
