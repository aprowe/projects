<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tauri-video-prototype</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        height: 100%;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 8px;
      }
      #stage {
        background: #111;
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: 80vh;
      }
      #status {
        font-size: 12px;
        opacity: 0.7;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 11px;
        line-height: 1.4;
        color: #cde;
        pointer-events: none;
        white-space: pre;
      }
      #hud .label { color: #889; }
      #hud .val { color: #fff; }
      #hud .warn { color: #ffb86c; }
      #hud .bad { color: #ff6b6b; }
      #controls {
        position: fixed;
        top: 8px;
        right: 8px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #333;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
      }
      #controls button {
        background: #222;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 3px;
        padding: 4px 8px;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      #controls button.active {
        background: #2a4a2a;
        border-color: #5c5;
        color: #fff;
      }
      #controls button:hover { background: #333; }
      #speed-bar {
        margin-top: 6px;
        height: 6px;
        background: #222;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }
      #speed-bar .fill {
        height: 100%;
        background: linear-gradient(90deg, #5cf 0%, #5c5 50%, #fc5 100%);
        transition: width 0.05s linear;
      }
      #speed-bar .tick {
        position: absolute;
        top: 0; bottom: 0;
        width: 1px;
        background: #fff;
        opacity: 0.4;
      }
      #speed-text {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="stage" width="16" height="16"></canvas>
      <div id="status">idle</div>
    </div>
    <pre id="hud">starting…</pre>
    <div id="controls">
      <div style="opacity:0.6">playback mode</div>
      <button data-mode="realtime" class="active">realtime · 1.0×</button>
      <button data-mode="sine-gentle">sine · 1 ± 0.5, 6s</button>
      <button data-mode="sine-wild">sine · 1 ± 0.9, 3s</button>
      <button data-mode="sine-slow">sine · 1 ± 0.5, 12s</button>
      <div id="speed-text">speed 1.00×</div>
      <div id="speed-bar">
        <div class="tick" style="left:50%"></div>
        <div class="fill" style="width:33%"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
