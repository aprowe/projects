<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Claude Web Rewriter</title>
    <style>
      body {
        font: 14px system-ui, sans-serif;
        width: 320px;
        padding: 16px;
        margin: 0;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      label > span {
        display: block;
        color: #555;
        font-size: 12px;
        margin-bottom: 3px;
      }
      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      button {
        width: 100%;
        background: #1a1a1a;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 9px;
        font: inherit;
        cursor: pointer;
        margin-top: 4px;
      }
      button:hover {
        background: #333;
      }
      button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
      .hint {
        color: #888;
        font-size: 11px;
        margin-top: 6px;
        line-height: 1.4;
      }
      .examples {
        margin-top: 10px;
        font-size: 12px;
      }
      .examples a {
        display: block;
        color: #06c;
        cursor: pointer;
        padding: 2px 0;
        text-decoration: none;
      }
      .examples a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Claude Web Rewriter</h1>
    <label>
      <span>Anthropic API key</span>
      <input id="apiKey" type="password" placeholder="sk-ant-…" />
    </label>
    <label>
      <span>Rewrite prompt</span>
      <textarea
        id="prompt"
        placeholder="rewrite as if written by a child"
      ></textarea>
      <div class="examples">
        Try:
        <a data-preset="rewrite as if written by a 7-year-old child"
          >…as a child</a
        >
        <a data-preset="rewrite as a hard-boiled noir detective monologue"
          >…as noir detective</a
        >
        <a data-preset="rewrite in the voice of a pirate, with nautical metaphors"
          >…as a pirate</a
        >
        <a data-preset="rewrite as Shakespearean iambic pentameter where natural"
          >…as Shakespeare</a
        >
      </div>
    </label>
    <label>
      <span>Model</span>
      <select id="model">
        <option value="claude-opus-4-7">Opus 4.7 (best, slowest)</option>
        <option value="claude-sonnet-4-6">Sonnet 4.6 (balanced)</option>
        <option value="claude-haiku-4-5">Haiku 4.5 (fastest)</option>
      </select>
    </label>
    <button id="run">Rewrite this page</button>
    <div class="hint">
      Your API key is stored locally in this browser and sent only to
      api.anthropic.com.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
